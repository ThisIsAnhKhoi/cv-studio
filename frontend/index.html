<!DOCTYPE html>
<html lang="vi">

    <meta charset="UTF-8" />

    <meta name="description" content="Tạo hồ sơ năng lực (CV/Portfolio) trực tuyến, tùy biến phong cách, hỗ trợ Dark/Light mode và chuẩn in ấn A4 quốc tế." />

    <!-- Open Graph & Social Sharing Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CV Studio — Nền Tảng Tạo & Quản Lý CV Cá Nhân Chuyên Nghiệp" />
    <meta property="og:description" content="Tạo hồ sơ năng lực (CV/Portfolio) trực tuyến, tùy biến phong cách, hỗ trợ Dark/Light mode và chuẩn in ấn A4 quốc tế." />
    <meta property="og:image" content="/favicon.svg" />
    <meta property="og:url" content="https://cvstudio.vn" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CV Studio — Nền Tảng Tạo & Quản Lý CV Cá Nhân Chuyên Nghiệp" />
    <meta name="twitter:description" content="Tạo hồ sơ năng lực (CV/Portfolio) trực tuyến, tùy biến phong cách, hỗ trợ Dark/Light mode và chuẩn in ấn A4 quốc tế." />

    <!-- Chặn triệt để hiện tượng Flash trắng (FOUC) khi tải hoặc reload trang: thực thi đồng bộ trước khi vẽ DOM -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cv_studio_theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && systemDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html.dark {
        color-scheme: dark;
        background-color: #020617;
      }
      html.dark body {
        background-color: #020617;
      }
      html.light {
        color-scheme: light;
        background-color: #f1f5f9;
      }
      html.light body {
        background-color: #f1f5f9;
      }
    </style>

    <!-- Google Fonts: WOFF2 with Vietnamese & Latin subsetting (Initial payload < 400 kB) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Montserrat:ital,wght@0,500;0,600;0,700;1,400&family=Outfit:wght@400;500;600;700;800&family=Pacifico&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap&subset=vietnamese,latin"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased">
